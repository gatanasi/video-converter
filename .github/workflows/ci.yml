name: Video Converter - CI

# Deliberately no `paths:` filter. A required status check that never reports
# blocks a PR forever, so CI has to start for every PR to main. Cost is kept
# down inside build-jobs.yml, where the `Detect Changes` job (dorny/paths-filter)
# skips the frontend and backend suites when nothing relevant changed.
on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Lint, Test & Build Docker
    uses: ./.github/workflows/build-jobs.yml
    with:
      build_docker: true
      push_docker: false

  smoke-tests:
    name: Smoke Tests
    needs: build
    uses: ./.github/workflows/smoke-tests.yml
    with:
      checkout_ref: ${{ github.sha }}
