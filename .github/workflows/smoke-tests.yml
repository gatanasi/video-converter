name: Smoke Tests

on:
  workflow_dispatch:
    inputs:
      node_version:
        description: 'Node.js version for smoke-test dependencies'
        required: false
        type: string
        default: '24.x'
      checkout_ref:
        description: 'Git ref to test'
        required: false
        type: string
  workflow_call:
    inputs:
      node_version:
        required: false
        type: string
        default: '24.x'
      checkout_ref:
        required: false
        type: string
        default: ${{ github.sha }}

permissions:
  contents: read

jobs:
  smoke-tests:
    name: Docker Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node_version || '24.x' }}
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install test dependencies
        run: pnpm install --filter smoke-tests --frozen-lockfile

      - name: Run smoke tests
        env:
          BASE_URL: http://localhost:3000
          GOOGLE_DRIVE_API_KEY: test-api-key
        run: pnpm test:smoke
